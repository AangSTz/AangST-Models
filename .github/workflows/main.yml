   name: Unzip File
   on: [push] # Akan berjalan setiap kali kamu push/upload file
   jobs:
     unzip:
       runs-on: ubuntu-latest
       steps:
         - name: Checkout repo
           uses: actions/checkout@v4
         - name: Unzip action
           run: |
             unzip -o *.zip # Meng-extract semua file zip
             git config --global user.name 'github-actions'
             git config --global user.email 'github-actions@github.com'
             git add .
             git commit -m "Automated unzip" || exit 0
             git push
